version: '3.8'

services:
  # Backend Server
  backend:
    build:
      context: ./SmileCare_Server
      dockerfile: Dockerfile
    container_name: smilecare-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./SmileCare_Server/.env
    networks:
      - smilecare-network
    volumes:
      - ./SmileCare_Server:/app
      - /app/node_modules

  # Frontend Client
  frontend:
    build:
      context: ./SmileCare_Client
      dockerfile: Dockerfile
    container_name: smilecare-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - smilecare-network
    volumes:
      - ./SmileCare_Client:/app
      - /app/node_modules
    stdin_open: true
    tty: true

networks:
  smilecare-network:
    driver: bridge
